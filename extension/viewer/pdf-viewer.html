<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EZSign PDF Viewer</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #eef4f5;
        --panel: #ffffff;
        --border: #d7e3e6;
        --text: #102126;
        --muted: #5f7179;
        --accent: #0f766e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top right, rgba(14, 165, 233, 0.16), transparent 28%),
          linear-gradient(180deg, #edf5f6 0%, var(--bg) 100%);
        color: var(--text);
        font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
      }

      .layout {
        display: grid;
        gap: 16px;
        min-height: 100vh;
        padding: 20px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 18px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
      }

      .eyebrow {
        margin: 0 0 6px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 22px;
      }

      .muted {
        color: var(--muted);
      }

      .viewer-shell {
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 18px;
        min-height: calc(100vh - 180px);
        overflow: hidden;
      }

      iframe {
        border: 0;
        display: block;
        height: calc(100vh - 182px);
        width: 100%;
      }

      .error {
        align-items: center;
        display: grid;
        min-height: calc(100vh - 182px);
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <main class="layout">
      <section class="panel header">
        <div>
          <p class="eyebrow">EZSign PDF</p>
          <h1 id="fileName">Opening PDF...</h1>
        </div>
        <p class="muted" id="statusText">Preparing Chrome PDF preview.</p>
      </section>

      <section class="viewer-shell">
        <iframe id="pdfFrame" title="PDF preview"></iframe>
        <div class="error muted" id="errorState" hidden>
          The PDF preview could not be loaded.
        </div>
      </section>
    </main>

    <script src="./pdf-viewer.js"></script>
  </body>
</html>
